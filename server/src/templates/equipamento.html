{% extends "base.html" %}

{% block content %}
<div id="detalhes-Equipment">
    <h2>Detalhes do Equipment</h2>
    <div id="loading">Carregando...</div>
    <div id="conteudo" style="display:none;">
        <section>
            <h3>Identificação</h3>
            <p><strong>Tombo:</strong> <span id="tombo"></span></p>
            <p><strong>Serial:</strong> <span id="numero-serie"></span></p>
            <p><strong>UUID:</strong> <span id="uuid"></span></p>
            <p><strong>manufacturer:</strong> <span id="manufacturer"></span></p>
            <p><strong>model:</strong> <span id="model"></span></p>
        </section>
        <section>
            <h3>Hardware Atual</h3>
            <p><strong>Processador:</strong> <span id="cpu"></span></p>
            <p><strong>Memória:</strong> <span id="memoria"></span></p>
            <p><strong>Discos:</strong> <span id="armazenamento"></span></p>
            <p><strong>GPU:</strong> <span id="gpu"></span></p>
        </section>
        <section>
            <h3>Patrimônio</h3>
            <p><strong>Localização:</strong> <span id="location"></span></p>
            <p><strong>status:</strong> <span id="status"></span></p>
            <p><strong>Garantia:</strong> <span id="garantia"></span></p>
        </section>
        <section>
            <h3>Histórico</h3>
            <ul id="historico-lista"></ul>
        </section>
        <section>
            <h3>Anotações</h3>
            <ul id="anotacoes-lista"></ul>
        </section>
    </div>
</div>

<script>
    const tombo = window.location.pathname.split('/').pop();
    fetch(`/api/v1/Equipments/${tombo}`)
        .then(response => response.json())
        .then(equip => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('conteudo').style.display = 'block';

            document.getElementById('tombo').textContent = equip.tombo;
            document.getElementById('numero-serie').textContent = equip.serial_number || '';
            document.getElementById('uuid').textContent = equip.uuid || '';
            document.getElementById('manufacturer').textContent = equip.manufacturer?.valor || '';
            document.getElementById('model').textContent = equip.model?.valor || '';
            document.getElementById('location').textContent = equip.location;
            document.getElementById('status').textContent = equip.status;
            // Garantia
            let garantia = 'NÃO';
            if (equip.warranty_start && equip.warranty_period) {
                const fim = new Date(equip.warranty_start);
                fim.setMonth(fim.getMonth() + equip.warranty_period);
                if (fim > new Date()) {
                    garantia = `SIM (até ${fim.toLocaleDateString()})`;
                }
            }
            document.getElementById('garantia').textContent = garantia;

            // Buscar inventário mais recente
            fetch(`/api/v1/Equipments/${tombo}/inventarios`)
                .then(res => res.json())
                .then(inventarios => {
                    if (inventarios.length > 0) {
                        const inv = inventarios[0];
                        document.getElementById('cpu').textContent = inv.cpu || '';
                        document.getElementById('memoria').textContent = inv.memoria || '';
                        document.getElementById('armazenamento').textContent = inv.armazenamento || '';
                        document.getElementById('gpu').textContent = inv.gpu || '';
                    }
                });

            // Histórico
            fetch(`/api/v1/Equipments/${tombo}/historico`)
                .then(res => res.json())
                .then(historico => {
                    const ul = document.getElementById('historico-lista');
                    historico.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = `${new Date(item.data).toLocaleString()} - ${item.user}: ${item.tipo} (${item.previous_value || ''} -> ${item.next_value || ''})`;
                        ul.appendChild(li);
                    });
                });

            // Anotações (não temos endpoint específico para listar anotações, vamos pegar da rota de Equipments? 
            // Melhor: adicionar uma rota para anotações. Por enquanto, podemos pular.
        });
</script>
{% endblock %}
