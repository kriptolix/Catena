{% extends "base.html" %}

{% block content %}
<h2>Equipments</h2>

<div class="filtros">
    <input type="text" id="filtro-tombo" placeholder="Tombo">
    <input type="text" id="filtro-manufacturer" placeholder="manufacturer">
    <input type="text" id="filtro-model" placeholder="model">
    <input type="text" id="filtro-location" placeholder="Localização">
    <select id="filtro-status">
        <option value="">Todos</option>
        <option value="funcional">Funcional</option>
        <option value="defeituoso">Defeituoso</option>
        <option value="devolvido">Devolvido</option>
    </select>
    <button id="btn-filtrar">Filtrar</button>
</div>

<div id="tabela-Equipments">
    <table>
        <thead>
            <tr>
                <th>Tombo</th>
                <th>model</th>
                <th>Localização</th>
                <th>status</th>
                <th>Garantia</th>
                <th>Último Inventário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela">
            <!-- preenchido via JS -->
        </tbody>
    </table>
</div>

<div id="paginacao">
    <button id="pagina-anterior">Anterior</button>
    <span id="info-pagina">Página 1</span>
    <button id="proxima-pagina">Próxima</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Configuração inicial
    let paginaAtual = 0;
    const limite = 10;

    function carregarEquipments(filtros = {}) {
        const params = new URLSearchParams({
            skip: paginaAtual * limite,
            limit: limite,
            ...filtros
        });
        fetch(`/api/v1/Equipments?${params}`)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('corpo-tabela');
                tbody.innerHTML = '';
                data.forEach(equip => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${equip.tombo}</td>
                        <td>${equip.model?.valor || ''}</td>
                        <td>${equip.location}</td>
                        <td>${equip.status}</td>
                        <td>${calcularGarantia(equip)}</td>
                        <td>${equip.atualizado_em ? new Date(equip.atualizado_em).toLocaleDateString() : ''}</td>
                        <td><a href="/Equipments/${equip.tombo}">Detalhes</a></td>
                    `;
                    tbody.appendChild(tr);
                });
                document.getElementById('info-pagina').textContent = `Página ${paginaAtual + 1}`;
            });
    }

    function calcularGarantia(equip) {
        if (!equip.warranty_start || !equip.warranty_period) return 'NÃO';
        const fim = new Date(equip.warranty_start);
        fim.setMonth(fim.getMonth() + equip.warranty_period);
        const hoje = new Date();
        if (fim > hoje) {
            return `SIM (até ${fim.toLocaleDateString()})`;
        } else {
            return 'NÃO';
        }
    }

    // Filtros
    document.getElementById('btn-filtrar').addEventListener('click', () => {
        paginaAtual = 0;
        const filtros = {
            asset_number document.getElementById('filtro-tombo').value,
            manufacturer: document.getElementById('filtro-manufacturer').value,
            model: document.getElementById('filtro-model').value,
            location: document.getElementById('filtro-location').value,
            status: document.getElementById('filtro-status').value
        };
        carregarEquipments(filtros);
    });

    // Paginação
    document.getElementById('pagina-anterior').addEventListener('click', () => {
        if (paginaAtual > 0) {
            paginaAtual--;
            carregarEquipments();
        }
    });
    document.getElementById('proxima-pagina').addEventListener('click', () => {
        paginaAtual++;
        carregarEquipments();
    });

    // Carregar inicial
    carregarEquipments();
</script>
{% endblock %}
