{% extends "base.html" %}

{% block content %}
<h2>Equipamentos</h2>

<div class="filtros">
    <input type="text" id="filtro-tombo" placeholder="Tombo">
    <input type="text" id="filtro-fabricante" placeholder="Fabricante">
    <input type="text" id="filtro-modelo" placeholder="Modelo">
    <input type="text" id="filtro-localizacao" placeholder="Localização">
    <select id="filtro-estado">
        <option value="">Todos</option>
        <option value="funcional">Funcional</option>
        <option value="defeituoso">Defeituoso</option>
        <option value="devolvido">Devolvido</option>
    </select>
    <button id="btn-filtrar">Filtrar</button>
</div>

<div id="tabela-equipamentos">
    <table>
        <thead>
            <tr>
                <th>Tombo</th>
                <th>Modelo</th>
                <th>Localização</th>
                <th>Estado</th>
                <th>Garantia</th>
                <th>Último Inventário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela">
            <!-- preenchido via JS -->
        </tbody>
    </table>
</div>

<div id="paginacao">
    <button id="pagina-anterior">Anterior</button>
    <span id="info-pagina">Página 1</span>
    <button id="proxima-pagina">Próxima</button>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Configuração inicial
    let paginaAtual = 0;
    const limite = 10;

    function carregarEquipamentos(filtros = {}) {
        const params = new URLSearchParams({
            skip: paginaAtual * limite,
            limit: limite,
            ...filtros
        });
        fetch(`/api/v1/equipamentos?${params}`)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('corpo-tabela');
                tbody.innerHTML = '';
                data.forEach(equip => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${equip.tombo}</td>
                        <td>${equip.modelo?.valor || ''}</td>
                        <td>${equip.localizacao}</td>
                        <td>${equip.estado}</td>
                        <td>${calcularGarantia(equip)}</td>
                        <td>${equip.atualizado_em ? new Date(equip.atualizado_em).toLocaleDateString() : ''}</td>
                        <td><a href="/equipamentos/${equip.tombo}">Detalhes</a></td>
                    `;
                    tbody.appendChild(tr);
                });
                document.getElementById('info-pagina').textContent = `Página ${paginaAtual + 1}`;
            });
    }

    function calcularGarantia(equip) {
        if (!equip.inicio_garantia || !equip.duracao_garantia) return 'NÃO';
        const fim = new Date(equip.inicio_garantia);
        fim.setMonth(fim.getMonth() + equip.duracao_garantia);
        const hoje = new Date();
        if (fim > hoje) {
            return `SIM (até ${fim.toLocaleDateString()})`;
        } else {
            return 'NÃO';
        }
    }

    // Filtros
    document.getElementById('btn-filtrar').addEventListener('click', () => {
        paginaAtual = 0;
        const filtros = {
            tombo: document.getElementById('filtro-tombo').value,
            fabricante: document.getElementById('filtro-fabricante').value,
            modelo: document.getElementById('filtro-modelo').value,
            localizacao: document.getElementById('filtro-localizacao').value,
            estado: document.getElementById('filtro-estado').value
        };
        carregarEquipamentos(filtros);
    });

    // Paginação
    document.getElementById('pagina-anterior').addEventListener('click', () => {
        if (paginaAtual > 0) {
            paginaAtual--;
            carregarEquipamentos();
        }
    });
    document.getElementById('proxima-pagina').addEventListener('click', () => {
        paginaAtual++;
        carregarEquipamentos();
    });

    // Carregar inicial
    carregarEquipamentos();
</script>
{% endblock %}
