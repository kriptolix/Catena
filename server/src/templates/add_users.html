{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Incluir Novo Usuário</h2>
    
    <form id="user-form" action="/users" method="POST">
        <div class="form-group">
            <label for="nome_completo">Nome Completo:</label>
            <input type="text" id="nome_completo" name="nome_completo" required>
        </div>
        
        <div class="form-group">
            <label for="login">Login:</label>
            <input type="text" id="login" name="login" required>
        </div>
        
        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>
        
        <div class="form-group">
            <label for="tipo_user">Tipo de Usuário:</label>
            <select id="tipo_user" name="tipo_user" required>
                <option value="user">Usuário</option>
                <option value="administrador">Administrador</option>
            </select>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn-primary">Incluir Usuário</button>
            <a href="/" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('user-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const data = {
            nome_completo: formData.get('nome_completo'),
            login: formData.get('login'),
            senha: formData.get('senha'),
            is_admin: formData.get('tipo_user') === 'administrador'
        };
        
        fetch('/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (response.ok) {
                alert('Usuário incluído com sucesso!');
                window.location.href = '/';
            } else {
                return response.text().then(text => {
                    alert('Erro ao incluir usuário: ' + text);
                });
            }
        })
        .catch(error => {
            alert('Erro ao incluir usuário: ' + error.message);
        });
    });
</script>
{% endblock %}
