{% extends "base.html" %}

{% block content %}
<h2>Adicionar Equipment</h2>
<form id="add-Equipment-form">
    <div>
        <label>Tombo (opcional):</label>
        <input type="text" id="tombo" placeholder="Deixe em branco para gerar automático">
    </div>
    <div>
        <label>UUID:</label>
        <input type="text" id="uuid">
    </div>
    <div>
        <label>manufacturer:</label>
        <input type="text" id="manufacturer">
    </div>
    <div>
        <label>model:</label>
        <input type="text" id="model">
    </div>
    <div>
        <label>Número de Série:</label>
        <input type="text" id="serial_number">
    </div>
    <div>
        <label>Localização (obrigatório):</label>
        <input type="text" id="location" required>
    </div>
    <div>
        <label>status:</label>
        <select id="status">
            <option value="funcional">Funcional</option>
            <option value="defeituoso">Defeituoso</option>
            <option value="devolvido">Devolvido</option>
        </select>
    </div>
    <div>
        <label>Início da Garantia:</label>
        <input type="date" id="warranty_start">
    </div>
    <div>
        <label>Duração (meses):</label>
        <input type="number" id="warranty_period" min="0">
    </div>
    <button type="submit">Cadastrar</button>
</form>
<div id="add-message"></div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('add-Equipment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('access_token');
        if (!token) {
            document.getElementById('add-message').innerHTML = '<span style="color:red;">Você precisa estar logado.</span>';
            return;
        }

        const dados = {
            asset_number document.getElementById('tombo').value || undefined,
            uuid: document.getElementById('uuid').value || undefined,
            manufacturer: document.getElementById('manufacturer').value || undefined,
            model: document.getElementById('model').value || undefined,
            serial_number: document.getElementById('serial_number').value || undefined,
            location: document.getElementById('location').value,
            status: document.getElementById('status').value,
            warranty_start: document.getElementById('warranty_start').value || undefined,
            warranty_period: document.getElementById('warranty_period').value ? parseInt(document.getElementById('warranty_period').value) : undefined
        };

        try {
            const response = await fetch('/api/v1/Equipments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(dados)
            });
            if (response.ok) {
                const equip = await response.json();
                document.getElementById('add-message').innerHTML = `<span style="color:green;">Equipment ${equip.tombo} cadastrado com sucesso! <a href="/Equipments/${equip.tombo}">Ver detalhes</a></span>`;
                // Limpar formulário opcional
            } else {
                const err = await response.json();
                document.getElementById('add-message').innerHTML = `<span style="color:red;">Erro: ${err.detail || 'Falha ao cadastrar'}</span>`;
            }
        } catch (error) {
            document.getElementById('add-message').innerHTML = `<span style="color:red;">Erro de conexão</span>`;
        }
    });
</script>
{% endblock %}
