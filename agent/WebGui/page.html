<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>DataCollector</title>
    <link rel='stylesheet' href='page.css'>
    <script src='page.js'></script>    
</head>

<body>
    <div class='container'>
        <div class='header'>
            <h1>📊 DataCollector</h1>
            <p style='margin-top: 5px; opacity: 0.9;'>Coleta e envio de inventário de computadores</p>
        </div>

        <div id='statusMessage' class='status info'>
            Aguardando análise do equipamento
        </div>

        <div class='card'>
            <h2>🔍 Análise do Equipamento</h2>
            <button id='btnAnalyze' class='btn' onclick='analyze()'>
                Analisar equipamento
            </button>
            <div id='loadingAnalyze' class='loading hidden' style='margin-left: 15px;'></div>
        </div>

        <div class='card' id='hardwareInfo' style='display:none;'>
            <h2>💻 Informações do Equipamento</h2>
            <div class='hardware-grid'>
                <div class='hardware-item'><label>Fabricante:</label> <span id='fabricante'>-</span></div>
                <div class='hardware-item'><label>Modelo:</label> <span id='modelo'>-</span></div>
                <div class='hardware-item'><label>Serial:</label> <span id='serial'>-</span></div>
                <div class='hardware-item'><label>CPU:</label> <span id='cpu'>-</span></div>
                <div class='hardware-item'><label>Memória:</label> <span id='memoria'>-</span></div>
                <div class='hardware-item'><label>Armazenamento:</label> <span id='armazenamento'>-</span></div>
                <div class='hardware-item'><label>Sistema:</label> <span id='sistema'>-</span></div>
                <div class='hardware-item'><label>Arquitetura:</label> <span id='arquitetura'>-</span></div>
            </div>
        </div>

        <div class='card'>
            <h2>🌐 Servidor e Envio</h2>

            <div class='grid'>
                <div class='field'>
                    <label>Servidor:</label>
                    <input id='serverAddress' value='192.168.1.10' placeholder='IP ou nome do servidor'>
                </div>
                <div class='field'>
                    <label>Porta:</label>
                    <input id='serverPort' value='54321' type='number'>
                </div>
            </div>

            <button id='btnTestServer' class='btn' onclick='testServer()'>
                Testar servidor
            </button>
            <span id='serverStatus' style='margin-left: 15px;'></span>

            <div class='grid' style='margin-top: 20px;'>
                <div class='field'>
                    <label>Tombo (opcional):</label>
                    <input id='tombo' placeholder='Deixe em branco para gerar automático'>
                </div>
                <div class='field'>
                    <label>Localização *:</label>
                    <input id='localizacao' placeholder='Localização do equipamento' required>
                </div>
            </div>
            <div class='field'>
                <label>Observação:</label>
                <textarea id='observacao' placeholder='Observações adicionais...'></textarea>
            </div>

            <div class='btn-group'>
                <button id='btnSaveLocal' class='btn btn-success' onclick='saveLocal()'>
                    💾 Salvar localmente
                </button>
                <button id='btnSend' class='btn btn-success' onclick='sendToServer()' disabled>
                    📤 Enviar inventário
                </button>
            </div>
        </div>
    </div>
</body>

</html>"
